version: '3.8'

services:
  tracex:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tracex-app
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - API_PORT=8000
      - API_HOST=0.0.0.0
      - DATABASE_URL=sqlite:///./trace_x.db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
    volumes:
      - tracex_data:/app
    restart: unless-stopped

volumes:
  tracex_data:
